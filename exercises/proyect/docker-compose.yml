version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1905
      POSTGRES_DB: autohub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:1905@db:5432/autohub
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: supersecretjwt
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"

volumes:
  pgdata:
